<style>
:root{
  --bg:#3a0d0d; --fg:#fff6dc; --btn:rgba(255,255,255,.2); --btn-on:rgba(255,221,0,.55); --btn-line:rgba(255,255,255,.55);
  --font-pixel:'Press Start 2P','Courier New',monospace;
  --s:min(14vh,72px);
  --b:calc(var(--hud,0px) + 8px + env(safe-area-inset-bottom,0px));
  --l:calc(10px + env(safe-area-inset-left,0px));
  --r:calc(10px + env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);overflow:hidden;font-family:var(--font-pixel);-webkit-user-select:none;user-select:none;touch-action:none}
#app{position:fixed;inset:0;display:grid;place-items:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;box-shadow:0 0 0 2px #7a1a1a,0 10px 40px rgba(0,0,0,.6)}
#touch{position:fixed;inset:0;pointer-events:none}
#touch[hidden]{display:none}
.tb{position:absolute;pointer-events:auto;width:var(--s);height:var(--s);border-radius:50%;border:3px solid var(--btn-line);background:var(--btn);
  color:#fff;font:700 calc(var(--s)*0.32)/1 var(--font-pixel);display:grid;place-items:center;touch-action:none;-webkit-tap-highlight-color:transparent;padding:0}
.tb.on{background:var(--btn-on);border-color:#ffdd00}
.tb.sm{font-size:calc(var(--s)*0.19)}
#tL{left:var(--l);bottom:calc(var(--b) + var(--s)*0.35)}
#tR{left:calc(var(--l) + var(--s)*1.25);bottom:calc(var(--b) + var(--s)*0.35)}
#tJ{right:var(--r);bottom:calc(var(--b) + var(--s)*0.2);width:calc(var(--s)*1.45);height:calc(var(--s)*1.45)}
#tS{right:calc(var(--r) + var(--s)*1.6);bottom:calc(var(--b) + var(--s)*0.1);background:rgba(60,150,255,.35);border-color:#9fd0ff}
#tS.on{background:rgba(60,150,255,.7)}
#tP,#tM,#tV{top:calc(10px + env(safe-area-inset-top,0px));width:46px;height:46px;border-radius:12px;font-size:12px}
#tP{right:calc(10px + env(safe-area-inset-right,0px))}
#tM{right:calc(64px + env(safe-area-inset-right,0px))}
#tV{right:calc(118px + env(safe-area-inset-right,0px))}
body:not([data-mode="play"]) #tL,body:not([data-mode="play"]) #tR,body:not([data-mode="play"]) #tJ,body:not([data-mode="play"]) #tS{display:none}
</style>
</head>
<body data-mode="menu">
<div id="app"><canvas id="cv" aria-label="Rescue 911 fire truck dino rescue game"></canvas></div>
<div id="touch" hidden>
  <button class="tb" id="tL" data-k="left" aria-label="Left">◀</button>
  <button class="tb" id="tR" data-k="right" aria-label="Right">▶</button>
  <button class="tb sm" id="tS" data-k="spray" aria-label="Spray water">SPRAY</button>
  <button class="tb sm" id="tJ" data-k="jump" aria-label="Jump">JUMP</button>
  <button class="tb" id="tP" data-k="pause" aria-label="Pause">II</button>
  <button class="tb" id="tM" data-k="mute" aria-label="Music on or off">♪</button>
  <button class="tb sm" id="tV" data-k="voice" aria-label="Voice on or off">TALK</button>
</div>

<script>
(function(){
"use strict";
/* =========================================================================
   Rescue 911: Fire Truck Dino Rescue
   Firefighter Kellan and his dog Bernie collect dinosaur eggs, hose down
   fires and grumpy dinos, and drive the fire truck through five places to
   rescue big sister Diana from Big Grumpasaur.
   Everything (characters, art, music, levels) is original.
   ========================================================================= */
const T=16, VH=200, PH=176;
const GRAV=0.3, MAXFALL=6, ACC=0.26, MAXRUN=1.8, JUMPV=-6.2, JUMP2V=-5.4;
let VW=320, SC=1;
const cv=document.getElementById('cv'), cx=cv.getContext('2d');
const lo=document.createElement('canvas'); lo.height=VH; let g=lo.getContext('2d');
const SAVE='rescue911.v1';
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[(Math.random()*a.length)|0];

/* ---------------- difficulty ---------------- */
// Easy is always the default when the game opens.
const DIFF=[
  {name:'EASY',  need:4, spd:0.55, dbl:true,  float:true,  hearts:0, stones:true,  fireHp:4, bossHp:4,  roar:280},
  {name:'MEDIUM',need:6, spd:0.85, dbl:true,  float:false, hearts:3, stones:false, fireHp:6, bossHp:7,  roar:220},
  {name:'HARD',  need:8, spd:1.2,  dbl:false, float:false, hearts:3, stones:false, fireHp:8, bossHp:10, roar:170},
];
let diff=0; const D_=()=>DIFF[diff];

/* ---------------- sprites ---------------- */
const PAL={k:'#000000',y:'#FFE14D',Y:'#D9A520',s:'#FFCBA4',S:'#E8A383',w:'#FFFFFF',b:'#2F6BFF',m:'#E0506A',
  c:'#1A6FE0',C:'#5FB0FF',g:'#55FF55',G:'#00AA00',p:'#2A2F4A',B:'#AA0000',L:'#55FF55',M:'#FF55FF',N:'#AA00AA',
  a:'#BFF6FF',D:'#444444',n:'#7A4A1E',r:'#FF4040',R:'#AA0000',V:'#AA00AA',v:'#FF55FF',o:'#FFC400',e:'#7a4a1e',E:'#c8894a',t:'#ffe9c9',
  T:'#D9A84E',h:'#C8502A',H:'#8A2E14',u:'#AA00AA',U:'#FF55FF',q:'#5500AA',f:'#6B3A1E',x:'#2A2F4A'};
function spr(rows,pal){
  pal=pal||PAL; const w=Math.max(...rows.map(r=>r.length)), h=rows.length;
  const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d');
  rows.forEach((r,j)=>{ for(let i=0;i<r.length;i++){ const ch=r[i]; if(ch!=='.'&&ch!==' '){ x.fillStyle=pal[ch]||'#f0f'; x.fillRect(i,j,1,1); } } });
  return c;
}
function flip(c){ const d=document.createElement('canvas'); d.width=c.width; d.height=c.height; const x=d.getContext('2d'); x.translate(c.width,0); x.scale(-1,1); x.drawImage(c,0,0); return d; }
function pair(c){ return {r:c,l:flip(c)}; }

// Kellan in his red firefighter helmet (gold badge, long back brim)
const FHEAD=[
"....kkkkkkk.....",
"...kRrrrrrrk....",
"..kRrrrrrrrrk...",
"..kRrrrrrooork..",
"..kRrrrrrooork..",
"kkRRRRRRRRRRRRk.",
"kRRkyysssssssk..",
"..kyysssssssssk.",
"..kyssswbssswbk.",
"..kSsssssssssk..",
"...ksssssmmssk..",
"....kkkkkkkkk..."];
const BODY_IDLE=[
".....kcccck.....",
"....kcCcccck....",
"...kgkCcccckgk..",
"...kgkCcccckgk..",
"...kggkcccckggk.",
"....kkcccccck...",
".....kppppk.....",
".....kpkkpk.....",
".....kpk.kpk....",
".....kpk.kpk....",
"....kBBk.kBBk...",
"....kkkk.kkkk..."];
const BODY_WALK=[
".....kcccck.....",
"....kcCcccck....",
"...kgkCcccckgk..",
"...kgkCcccckgk..",
"...kggkcccckggk.",
"....kkcccccck...",
".....kppppk.....",

const BODY_JUMP=[

"....kppppppk....",
"....kpkkkkpk....",

function bodyMap(rows,map,stripeRow){ return rows.map((r,j)=>[...r].map(ch=>(j===stripeRow&&(ch==='c'||ch==='C'))?'y':(map[ch]||ch)).join('')); }
function frames(head,map,stripe){
  const mk=b=>pair(spr(head.concat(bodyMap(b,map,stripe))));
  return {idle:mk(BODY_IDLE),walk:mk(BODY_WALK),jump:mk(BODY_JUMP)};
}

// Diana: reddish hair with a pink bow, purple outfit
const HEAD=[
"......kkkkk.....",
"....kkyyyyykk...",
"...kyyyyyyyyyk..",
"..kyyyyyyyyyyyk.",
"..kyyYyyyyYyyyk.",
"..kyYyyyyYyyyyk.",
"..kYyyyyyyyyyyk.",
"..kYyywbyyyywbk.",
"..ksssbbssssbbk.",
"..kSsssssssssk..",
"...ksssssmmssk..",
"....kksssssk...."];
const DIANA_HEAD=HEAD.map((r,j)=>{
  let a=[...r];
  if(j>=3&&j<=11){ a[1]='h'; a[0]='k'; if(j===11){ a[1]='k'; } }
  if(j===2){ a[1]='k'; a[2]='m'; } if(j===3){ a[2]='h'; } if(j===1){ a[2]='k'; a[3]='m'; }
  return a.join('');
});
const DI=frames(DIANA_HEAD.map(r=>[...r].map(ch=>({y:'h',Y:'H',b:'f'})[ch]||ch).join('')),{c:'u',C:'U',p:'q',g:'w'},-1);

Object.assign(PAL,{'1':'#4A2C14','2':'#7A4A24','3':'#2E7D32','4':'#66BB6A','5':'#2B1D12','6':'#4E3524','7':'#1565C0','8':'#64B5F6','9':'#A1887F'});
const tall=rows=>rows.slice(0,9).concat([rows[8],rows[8],rows[8]],rows.slice(9));
function adultFrames(head,map){ const mk=b=>pair(spr(head.concat(bodyMap(tall(b),map,-1)))); return {idle:mk(BODY_IDLE),walk:mk(BODY_WALK),jump:mk(BODY_JUMP)}; }
const MOM=adultFrames(DIANA_HEAD.map(r=>[...r].map(ch=>({y:'2',Y:'1',h:'2',H:'1',b:'f'})[ch]||ch).join('')),{c:'3',C:'4',p:'3',g:'s',B:'1'});
const DAD=adultFrames(HEAD.map((r,j)=>j===9?"..kSsss5555ssk..":r).map(r=>[...r].map(ch=>({y:'6',Y:'5',b:'f'})[ch]||ch).join('')),{c:'7',C:'8',p:'9',g:'s',B:'D'});
// who gets rescued where (level index)
const FAMILY={mom:{fr:MOM,name:'MOM',lvl:1},dad:{fr:DAD,name:'DAD',lvl:3}};
const ridersFor=(i,incl)=>Object.values(FAMILY).filter(m=>m.lvl<i||(incl&&m.lvl===i)).map(m=>m.fr);

// Bernie: brown and cream pup with a red collar and a tiny fire helmet
const PUP=["..kk......kk....",".keek....keek...",".keeEkkkkEeek...","..kEEEEEEEEk....","..kEwkEEEwkEk...","..kEEEEEEEEEk...","..kEEttkkttEk...","...kEtttttEk....","....krrrrrk.....","...kEEEEEEEk..k.","..kEEttttEEEkkek","..kEEttttEEEEek.","..kEEEEEEEEEEk..","..kEk.kEk.kEk...","..kkk.kkk.kkk..."];
function withHat(c){ const x=c.getContext('2d'); x.fillStyle='#000'; x.fillRect(4,0,7,3); x.fillRect(3,2,9,2); x.fillStyle='#E53935'; x.fillRect(5,0,5,2); x.fillRect(4,2,7,1); x.fillStyle='#FFC400'; x.fillRect(7,0,1,1); return c; }
const PUPS={ shut:pair(withHat(spr(PUP))), open:pair(withHat(spr(PUP.map((r,j)=>j===7?"...kEtmmmtEk....":r)))) };

// Dinosaurs are built from rectangles with a chunky black outline.
function shapeSprite(W,H,shapes,cols,extra){
  const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  x.fillStyle='#000'; for(const [,a,b,w,h] of shapes){ x.fillRect(a-1,b,w+2,h); x.fillRect(a,b-1,w,h+2); }
  for(const [p,a,b,w,h] of shapes){ x.fillStyle=cols[p]; x.fillRect(a,b,w,h); }
  if(extra) extra(x); return c;
}
const px=(x,c,a,b,w,h)=>{ x.fillStyle=c; x.fillRect(a,b,w,h); };
function raptor(cols,step){
  const lg=step?[['b',8,15,3,4],['b',15,15,3,4],['a',7,18,5,2],['a',14,18,5,2]]:[['b',10,15,3,4],['b',13,15,3,4],['a',9,18,5,2],['a',12,18,5,2]];
  return shapeSprite(26,21,[['a',8,5,2,2],['a',11,4,2,3],['a',14,4,2,2],['b',0,8,4,2],['b',3,7,5,4],['b',7,7,11,8],['l',10,10,7,5],['b',15,2,10,7],['b',17,8,8,2],['a',18,10,3,2]].concat(lg),cols,x=>{
    px(x,'#fff',20,4,3,3); px(x,'#000',21,5,2,2); px(x,'#000',19,2,2,1); px(x,'#000',21,3,3,1);
    px(x,'#000',18,8,7,1); px(x,'#fff',19,9,1,1); px(x,'#fff',21,9,1,1); px(x,'#fff',23,9,1,1);
  });
}
function trike(cols,step){
  const lg=step?[['b',6,17,4,4],['b',12,17,4,4],['b',17,17,4,4],['b',21,17,3,4]]:[['b',8,17,4,4],['b',11,17,4,4],['b',18,17,4,4],['b',20,17,3,4]];
  return shapeSprite(33,22,[['a',8,4,3,2],['a',13,3,3,3],['b',0,9,6,4],['b',5,6,19,11],['l',8,12,14,5],['a',20,1,6,13],['b',23,5,8,9],['l',29,10,3,3],['h',27,1,2,5],['h',30,6,2,2]].concat(lg),cols,x=>{
    px(x,'#fff',25,7,3,3); px(x,'#000',26,8,2,2); px(x,'#000',24,5,2,1); px(x,'#000',26,6,3,1); px(x,'#000',27,12,3,1);
  });
}
function ptero(cols,up){
  const wg=up?[['a',2,1,9,3],['a',6,4,6,2]]:[['a',2,10,9,3],['a',6,8,6,2]];
  return shapeSprite(31,16,wg.concat([['a',13,2,6,2],['b',11,6,8,6],['l',13,8,4,4],['b',18,3,7,5],['l',24,5,6,2],['a',13,12,2,3],['a',16,12,2,3]]),cols,x=>{
    px(x,'#fff',20,4,3,2); px(x,'#000',21,4,2,2); px(x,'#000',19,3,4,1);
  });
}
function grump(calm){
  const cols={b:'#E0503A',l:'#FFD27A',a:'#8A2A1A',c:'#FFD700'};
  return shapeSprite(36,35,[['a',9,10,3,3],['a',13,9,3,3],['a',17,9,3,2],['b',0,18,9,5],['b',4,15,7,5],['b',8,12,17,15],['l',12,15,11,11],['b',19,3,16,11],['b',21,13,14,4],['b',10,27,6,6],['b',19,27,6,6],['a',9,32,8,2],['a',18,32,8,2],['a',25,17,4,2],['a',28,18,2,2],['c',23,1,9,3]],cols,x=>{
    px(x,'#FFD700',23,0,1,1); px(x,'#FFD700',27,0,1,1); px(x,'#FFD700',31,0,1,1); px(x,'#E53935',27,2,1,1);
    px(x,'#fff',28,6,4,4);
    if(calm){ px(x,'#000',29,7,2,2); px(x,'#000',27,4,5,1); px(x,'#000',24,14,8,1); px(x,'#000',23,13,1,1); px(x,'#000',32,13,1,1); px(x,'#FF8FB0',25,10,3,2); }
    else { px(x,'#000',30,7,2,2); px(x,'#000',26,4,3,1); px(x,'#000',29,5,4,1); px(x,'#000',22,13,13,1); for(const tx of [23,26,29,32]) px(x,'#fff',tx,14,1,2); }
  });
}
function baby(col){ return pair(shapeSprite(15,13,[['b',0,7,4,2],['b',3,5,7,6],['b',8,1,7,6],['b',4,11,2,2],['b',8,11,2,2]],{b:col},x=>{ px(x,'#fff',11,2,2,2); px(x,'#000',12,3,1,1); px(x,'#000',11,5,3,1); })); }
const RAPTOR=[pair(raptor({b:'#5CBF3A',l:'#C8F07A',a:'#2F7A1E'},0)),pair(raptor({b:'#5CBF3A',l:'#C8F07A',a:'#2F7A1E'},1))];

const GRUMP={mad:pair(grump(false)),calm:pair(grump(true))};
const BABIES=[baby('#5CBF3A'),baby('#2FB5B5'),baby('#9A6AD8'),baby('#F28A30')];

const EGG_ROWS=["...kkkk...","..kwwwwk..",".kwwwgwwk.",".kwwwwwwk.","kwwgwwwwwk","kwwwwwwgwk","kwwwwwwwwk","kwwwgwwwwk",".kwwwwwwk.",".kwwwwwwk.","..kwwwwk..","...kkkk..."];
const EGGS=[['#FFF6DC','#43A047'],['#D8F0FF','#1E88E5'],['#FFE0F0','#E040A0']].map(([w,gc])=>spr(EGG_ROWS,Object.assign({},PAL,{w,g:gc})));
const BONE=spr([".kk......kk.","kwwk....kwwk","kwwwkkkkwwwk",".kwwwwwwwwk.","kwwwkkkkwwwk","kwwk....kwwk",".kk......kk."]);
const HYDRANT=spr(["....kkkk....","...krrrrk...","..krrwrrrk..",".kkkkkkkkkk.","kDkrrrrrrkDk","kDkrrrrrrkDk",".kkrrrrrrkk.","..krrwrrrk..","..krrwrrrk..","..krrrrrrk..",".kkkkkkkkkk.",".kDDDDDDDDk.",".kkkkkkkkkk."]);
const HEART=spr(["..kkk....kkk....",".krrrk..krrrk...","krwrrrkkrrrrrk..","krwrrrrrrrrrrk..","krrrrrrrrrrrrk..",".krrrrrrrrrrk...","..krrrrrrrrk....","...krrrrrrk.....","....krrrrk......",".....krrk.......","......kk........"]);

/* ---------------- themes ---------------- */
const THEMES={
  meadow:{sky:['#7EC8FF','#DFF4FF'],far:'#9ED07A',near:'#6FB34A',ground:'#8A5A2E',groundD:'#5E3A1A',grass:'#58C23A',deco:'meadow',pit:'#3A8FE0',pitTop:'#8FD0FF'},

// Dinos are [tile x, kind, lowest difficulty they appear on]. The fire truck waits 8 tiles from the end.
const LEVELS=[
 {name:'DINO MEADOW',theme:'meadow',tune:'meadow',W:100,
  pits:[[24,2],[46,3],[68,3]], plats:[[12,15,6],[30,33,6],[35,38,5],[52,55,6],[57,60,5],[74,77,6],[80,82,5]],
  eggs:[[9,7],[13,5],[25,5],[32,5],[40,3],[47,5],[58,4],[84,7]], bones:[[19,7],[36,4],[63,7],[79,7]],
  crits:[[18,'raptor',0],[42,'raptor',1],[62,'raptor',0],[86,'trike',0],[54,'ptero',2]],
  fires:[28,64,90], springs:[40], flags:[22,44,66],
  tip:'THE BAD DINOS TOOK DIANA, MOM AND DAD! FIND EGGS, THEN JUMP IN THE FIRE TRUCK!',
  say:n=>`Oh no! The bad dinos took Diana, Mom and Dad! Kellan and Bernie to the rescue! Find ${n} dinosaur eggs, then jump in the fire truck.`,

let AC=null, muted=false;
function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); }
function tone(f1,f2,dur,type='square',vol=0.08,delay=0){
  if(!AC||muted) return; const t0=AC.currentTime+delay, o=AC.createOscillator(), v=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f1,t0); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  v.gain.setValueAtTime(vol,t0); v.gain.exponentialRampToValueAtTime(0.0001,t0+dur); o.connect(v).connect(AC.destination); o.start(t0); o.stop(t0+dur+0.02);
}
function noise(dur,vol=0.12,freq=900){ if(!AC||muted) return; const n=Math.floor(AC.sampleRate*dur), b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n); const s=AC.createBufferSource(), v=AC.createGain(), f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq; s.buffer=b; v.gain.value=vol; s.connect(f).connect(v).connect(AC.destination); s.start(); }

const NOTE_I={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function noteFreq(n){ const m=/^([A-G])([#b]?)(\d)$/.exec(n); if(!m) return 0; let i=NOTE_I[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0); const midi=12*(+m[3]+1)+i; return 440*Math.pow(2,(midi-69)/12); }
function parseSeq(str){ const out=[]; let pos=0; for(const tok of str.split(/[\s|]+/)){ if(!tok) continue; const [n,l]=tok.split(':'); const len=+l||2; out.push({f:n==='R'?0:noteFreq(n),at:pos,len}); pos+=len; } return {notes:out,len:pos}; }
for(const k in TUNES){ const tn=TUNES[k]; tn.L=parseSeq(tn.lead); tn.B=parseSeq(tn.bass); }
let soundMode=0; // 0 music and sound, 1 sound only, 2 quiet
let saveData={stars:{},soundMode:0,voice:true};
try{ const s=JSON.parse(localStorage.getItem(SAVE)||'null'); if(s) saveData=Object.assign(saveData,s); }catch(e){}
const persist=()=>{ try{ localStorage.setItem(SAVE,JSON.stringify(saveData)); }catch(e){} };
if(saveData.soundMode>=0&&saveData.soundMode<=2){ soundMode=saveData.soundMode; muted=soundMode===2; }
voiceOn=saveData.voice!==false;
let music={name:null,next:0,timer:null,gain:null}, toast=null;
function musicNode(){ if(!music.gain&&AC){ music.gain=AC.createGain(); music.gain.gain.value=0.5; music.gain.connect(AC.destination); } return music.gain; }
function playNote(f,t0,dur,type,vol){
  if(!f) return; const o=AC.createOscillator(), v=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t0);
  v.gain.setValueAtTime(0.0001,t0); v.gain.linearRampToValueAtTime(vol,t0+0.008); v.gain.setValueAtTime(vol,t0+Math.max(0.01,dur*0.7)); v.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(v).connect(musicNode()); o.start(t0); o.stop(t0+dur+0.03);
}
function scheduleMusic(){
  const tn=TUNES[music.name]; if(!tn||!AC) return;
  const sixteenth=60/tn.bpm/4, loopDur=tn.L.len*sixteenth;
  while(music.next<AC.currentTime+0.25){
    const loopStart=music.next;
    for(const n of tn.L.notes){ const t0=loopStart+n.at*sixteenth, d=n.len*sixteenth*0.92; playNote(n.f,t0,d,tn.wave||'square',0.035); if(tn.echo) playNote(n.f,t0+sixteenth*1.5,d,'triangle',0.014); }
    for(const n of tn.B.notes){ playNote(n.f,loopStart+n.at*sixteenth,n.len*sixteenth*0.8,'triangle',0.08); }
    music.next+=loopDur;
  }
}
function setMusic(name){
  if(soundMode!==0) name=null;
  if(music.name===name&&(name===null||music.timer)) return;
  if(music.gain){ const old=music.gain; try{ old.gain.setTargetAtTime(0,AC.currentTime,0.05); setTimeout(()=>old.disconnect(),400); }catch(e){} music.gain=null; }
  clearInterval(music.timer); music.timer=null; music.name=name;
  if(!name||!AC) return;
  music.next=AC.currentTime+0.12; scheduleMusic(); music.timer=setInterval(scheduleMusic,60);
}
function cycleSound(){
  soundMode=(soundMode+1)%3; muted=soundMode===2; saveData.soundMode=soundMode; persist();
  toast={msg:['MUSIC + SOUND','SOUND ONLY','QUIET'][soundMode],until:t+90};
  music.name=null; setMusic(wantedTune());
}
function toggleVoice(){
  voiceOn=!voiceOn; saveData.voice=voiceOn; persist();
  toast={msg:voiceOn?'VOICE ON':'VOICE OFF',until:t+90};
  if(voiceOn) say('Hello!'); else { try{ speechSynthesis.cancel(); }catch(e){} }
}
function wantedTune(){
  if(!AC) return null;
  const st=state==='pause'?pausedFrom:state;
  if(st==='play'||st==='drive') return (LV&&LV.boss&&LV.boss.state!=='sleep'&&LV.boss.state!=='calm')?'boss':LEVELS[lvl].tune;
  if(st==='ending') return 'ending';
  return 'title';
}

function loadLevel(i){
  lvl=i; const L=LEVELS[i], H=11, W=L.W, top=8, d=D_();
  const tl=Array.from({length:H},()=>Array(W).fill(' '));
  const inPit=x=>L.pits.some(([px,pw])=>x>=px&&x<px+pw);
  for(let x=0;x<W;x++) if(!inPit(x)) for(let y=top;y<H;y++) tl[y][x]='#';
  for(const [a,b,r] of L.plats) for(let x=a;x<=b;x++) if(tl[r][x]===' ') tl[r][x]='=';
  if(d.stones) for(const [px,pw] of L.pits) tl[7][px+Math.floor((pw-1)/2)]='=';
  let boss=null;
  if(L.boss){
    for(let y=0;y<top;y++){ tl[y][L.boss.wall]='G'; tl[y][L.boss.wall+1]='G'; }
    const max=d.bossHp*6; boss={x:(L.boss.wall-8)*T,y:top*T-48,w:40,h:48,vx:0,vy:0,face:-1,hp:max,max,state:'sleep',st:0,flash:0,arena:L.boss.arena*T,right:L.boss.wall*T};
  }
  LV={W,H,top,t:tl,boss,
    pitCols:new Set(Array.from({length:W},(_,x)=>x).filter(inPit)),

    bones:L.bones.map(([tx,r])=>({x:tx*T+2,y:r*T+7,w:12,h:7,got:false})),
    fires:L.fires.map(tx=>({x:tx*T,y:top*T,hp:d.fireHp,max:d.fireHp,out:false,steam:0})),

    springs:L.springs.map(tx=>({x:tx*T+2,y:top*T-13,w:12,h:13,squash:0,spout:0})),

const tileAt=(tx,ty)=>(tx<0||tx>=LV.W)?'#':(ty<0||ty>=LV.H)?' ':LV.t[ty][tx];
const solid=c=>c==='#'||c==='G';
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function moveX(e,dx){
  e.x+=dx; const x0=Math.floor(e.x/T), x1=Math.floor((e.x+e.w-0.01)/T), y0=Math.floor(e.y/T), y1=Math.floor((e.y+e.h-0.01)/T);
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++) if(solid(tileAt(tx,ty))){ if(dx>0) e.x=tx*T-e.w; else if(dx<0) e.x=(tx+1)*T; e.vx=0; return true; }
  return false;
}
function moveY(e,dy){
  const prevBottom=e.y+e.h; e.y+=dy; e.ground=false;
  const x0=Math.floor(e.x/T), x1=Math.floor((e.x+e.w-0.01)/T), y0=Math.floor(e.y/T), y1=Math.floor((e.y+e.h-0.01)/T);
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++){
    const c=tileAt(tx,ty);
    if(solid(c)){ if(dy>0){ e.y=ty*T-e.h; e.ground=true; } else if(dy<0){ e.y=(ty+1)*T; } e.vy=0; }
    else if(c==='='&&dy>0&&prevBottom<=ty*T+0.01){ e.y=ty*T-e.h; e.vy=0; e.ground=true; }

function drawCrit(c,ox){
  const x=c.x-ox; if(x<-40||x>VW+40) return;
  const fr=(t>>3)&1, right=c.vx>0;
  let im,dx,dy;
  if(c.k==='raptor'){ im=RAPTOR[fr][right?'r':'l']; dx=x-5; dy=c.y+c.h-21+(c.st==='walk'?fr:0); }
  else if(c.k==='trike'){ im=TRIKE[fr][right?'r':'l']; dx=x-4; dy=c.y+c.h-22; }
  else { im=PTERO[(t>>2)&1][right?'r':'l']; dx=x-6; dy=c.y-3; }
  if(c.st==='flee'&&c.ft>60&&((t>>2)&1)) return;
  g.drawImage(im,Math.round(dx),Math.round(dy));

  rect('#000',x-2,y-2,w+4,12); rect('#3A8FE0',x,y,w,8); rect(lerpCol('#3A8FE0','#E53935',k),x,y,Math.round(w*k),8);

function drawPlay(){
  const L=LEVELS[lvl], th=THEMES[L.theme], sh=shake>0?Math.round(rnd(-2,2)):0, ox=Math.round(camX)+sh;
  drawBG(th,ox); drawTiles(th,ox); drawEnts(ox); drawHelpArrow(ox); drawBossBar(); drawHUD();
}
function txt(s,x,y,size=8,color='#FFFFFF',align='left',shadow=true){
  cx.font=`${Math.round(size*SC)}px "Press Start 2P", "Courier New", monospace`; cx.textAlign=align; cx.textBaseline='top';
  if(shadow){ cx.fillStyle='#000'; cx.fillText(s,Math.round((x+1)*SC),Math.round((y+1)*SC)); }
  cx.fillStyle=color; cx.fillText(s,Math.round(x*SC),Math.round(y*SC));
}
function wrap(s,maxChars){ const out=[]; let line=''; for(const w of s.split(' ')){ if((line+' '+w).trim().length>maxChars){ out.push(line); line=w; } else line=(line+' '+w).trim(); } if(line) out.push(line); return out; }
function blitFlush(){ cx.imageSmoothingEnabled=false; cx.drawImage(lo,0,0,cv.width,cv.height); for(const f of post) f(); post.length=0; }
function bubble(msg,y=22){
  const lines=wrap(msg,Math.floor((VW-60)/7)), h=12+lines.length*10, w=VW-24;
  rect('#000',10,y,w+4,h+4); rect('#FFF6DC',12,y+2,w,h); g.drawImage(PUPS.open.r,14,y+2);
  lines.forEach((l,i)=>{ post.push(()=>txt(l,36,y+7+i*10,7,'#5A0E0E','left',false)); });
}
function overlayMsgs(){
  if(banner) bubble(banner.txt);
  if(toast){ if(t>toast.until) toast=null; else post.push(()=>txt(toast.msg,VW/2,PH-24,7,'#FFE14D','center')); }
}
function btn(x,y,w,h,label,fn,on,col){
  rect('#000',x-1,y-1,w+2,h+2); rect(on?'#FFE14D':(col||'#FFF6DC'),x,y,w,h); if(on) rect('#FFF3A0',x+2,y+2,w-4,2);
  const sz=clamp(Math.floor((w-8)/label.length),5,10); post.push(()=>txt(label,x+w/2,y+h/2-sz/2,sz,'#5A0E0E','center',false));

function groundStrip(th,y){ rect(th.ground,0,y,VW,VH-y); rect(th.grass,0,y,VW,5); }
function drawTitle(){
  const th=THEMES.meadow; drawBG(th,Math.floor(t*0.6)); groundStrip(th,PH-22);

  g.drawImage(RAPTOR[(t>>3)&1].r,Math.round(tx+120),PH-22-21+((t>>3)&1)); g.drawImage(TRIKE[(t>>3)&1].r,Math.round(tx+150),PH-22-22);
  drawTruck(tx,PH-22-40,{lights:true,kellan:true,bernie:true,rot:t*0.3});
  g.drawImage(PTERO[(t>>2)&1].l,Math.round(VW-wrapX(t*0.7,VW+60)),46+Math.round(Math.sin(t*0.05)*6));
  const bob=Math.round(Math.sin(t*0.05)*2);
  post.push(()=>{ txt('RESCUE 911',VW/2,8+bob,18,'#E53935','center'); txt('FIRE TRUCK DINO RESCUE!',VW/2,32+bob,8,'#FFE14D','center'); txt('HELP KELLAN AND BERNIE SAVE DIANA',VW/2,46,5,'#5A0E0E','center',false); });
  const dw=66, gap=8, dx=(VW-dw*3-gap*2)/2;

}
function drawSelect(){
  const th=THEMES.meadow; drawBG(th,Math.floor(t*0.4)); groundStrip(th,PH-18);
  post.push(()=>{ txt('PICK A PLACE!',VW/2,8,12,'#E53935','center'); txt(DIFF[diff].name+'   STARS: '+totalStars(),VW/2,26,7,'#5A0E0E','center',false); });
  const n=LEVELS.length, cw=Math.min(58,Math.floor((VW-20-(n-1)*6)/n)), gap=6, x0=(VW-(n*cw+(n-1)*gap))/2, y=42, ch=104;
  const icons=[RAPTOR[0].r,TRIKE[0].r,PTERO[0].r,RAPTOR[1].r,GRUMP.mad.r];
  LEVELS.forEach((L,i)=>{
    const x=x0+i*(cw+gap), on=selIdx===i, lt=THEMES[L.theme];
    rect('#000',x-2,y-2,cw+4,ch+4); rect(on?'#FFE14D':'#FFF6DC',x,y,cw,ch);
    rect(lt.sky[0],x+3,y+3,cw-6,34); rect(lt.far,x+3,y+26,cw-6,11); rect(lt.grass,x+3,y+34,cw-6,3);
    const ic=icons[i]; g.drawImage(ic,0,0,ic.width,ic.height,x+cw/2-ic.width*0.45,y+30-ic.height*0.9-(on?((t>>4)&1)*2:0),ic.width*0.9,ic.height*0.9);
    const nm=L.name.split(' ');
    post.push(()=>{ txt(String(i+1),x+cw/2,y+42,10,'#5A0E0E','center',false); nm.forEach((w,k)=>txt(w,x+cw/2,y+58+k*9,Math.min(7,Math.floor((cw-4)/w.length)),'#5A0E0E','center',false)); });
    const got=saveData.stars[i]||0; for(let k=0;k<3;k++) starPoly(x+cw/2+(k-1)*12,y+ch-10,5,k<got?'#F5A800':'#C9BFA8');
    hot.push({x,y,w:cw,h:ch,fn:()=>{ selIdx=i; startLevel(i); }});
  });
  btn(8,160,64,16,'BACK',()=>{ state='title'; sfx('menu'); });

}
function drawPauseOverlay(){
  g.fillStyle='rgba(60,10,10,.6)'; g.fillRect(0,0,VW,VH);
  post.push(()=>{ txt('PAUSED',VW/2,40,14,'#FFE14D','center'); });
  btn((VW-130)/2,76,130,20,'KEEP PLAYING',()=>{ state=pausedFrom; },false,'#8EE08E');
  btn((VW-130)/2,104,130,20,'PICK A PLACE',()=>{ state='select'; },false);
  btn((VW-130)/2,132,130,20,'START OVER',()=>{ startLevel(lvl); },false);
}
function drawLevelEnd(){
  const L=LEVELS[lvl], th=THEMES[L.theme]; drawBG(th,Math.floor(t*1.2));
  rect('#444',0,PH-26,VW,60); rect('#fff',0,PH-26,VW,2); for(let x=wrapX(-t*2.4,40)-40;x<VW;x+=40) rect('#FFE14D',x,PH-12,20,2);
  const tx=Math.min(VW/2-40,-90+endT*2.2);
  drawTruck(tx,PH-26-38,{lights:true,kellan:true,bernie:true,eggs:lastResult.eggs,rot:t*0.4,riders:ridersFor(lvl,true)});
  for(const p of parts){ g.fillStyle=p.c; g.fillRect(p.x|0,p.y|0,2,2); }
  const labels=['RESCUE RUN','ALL '+lastResult.eggsAll+' EGGS','ALL FIRES OUT'];
  for(let k=0;k<3;k++) starPoly(VW/2+(k-1)*30,64,11,k<lastResult.stars?'#FFE14D':'#7A6FA0');
  post.push(()=>{
    txt(L.captive?`YOU SAVED ${FAMILY[L.captive].name}!`:'NEE-NAW! YOU DID IT!',VW/2,8,10,'#FFE14D','center');
    wrap(L.next,30).forEach((l,i)=>txt(l,VW/2,26+i*11,7,'#fff','center'));
    txt('EGGS '+lastResult.eggs+'/'+lastResult.eggsAll+'   FIRES '+lastResult.fires+'/'+lastResult.firesAll+'   BONES '+lastResult.bones,VW/2,82,6,'#fff','center');
    txt(labels.filter((_,k)=>k<lastResult.stars).join(' + '),VW/2,94,5,'#FFE14D','center');
    if(endT>60&&((t>>4)&1)) txt(coarse?'TAP TO KEEP GOING':'PRESS SPACE',VW/2,PH+6,7,'#fff','center');
  });
  blitFlush();
}
// Finale: the fire truck raises its ladder, Diana climbs down, the eggs hatch.
function drawEnding(){
  const th=THEMES.peak, gy=PH-20; drawBG(th,0); groundStrip(th,gy);
  const towerX=VW-62, cageX=towerX-2, cageY=30;
  rect('#000',towerX-1,cageY+33,30,gy-cageY-33); rect('#5A4060',towerX,cageY+34,28,gy-cageY-34);
  const truckStop=VW-178, tx=Math.min(truckStop,-90+endT*2.4), ty=gy-40;
  const pvx=tx+8, pvy=ty+9, tipX=cageX+6, tipY=cageY+32;
  const fullAng=Math.atan2(tipY-pvy,tipX-pvx), fullLen=Math.hypot(tipX-pvx,tipY-pvy);
  const k=clamp((endT-110)/60,0,1), ang=fullAng*k, len=52+(fullLen-52)*k;
  // nest of eggs and the (now friendly) dino family on the left
  const nx=14; rect('#6B3F1C',nx,gy-6,64,7); rect('#8B5A2B',nx+2,gy-8,60,3);
  for(let i=0;i<4;i++){ const hatch=endT>330+i*20, ex=nx+6+i*14; if(hatch){ const bb=BABIES[i]; g.drawImage(bb.r,ex-2,gy-20-(((t>>3)+i)&1)*2); rect('#FFF6DC',ex,gy-8,10,4); } else g.drawImage(EGGS[i%3],ex,gy-18); }
  if(endT>290){ const im=GRUMP.calm.l; g.drawImage(im,0,0,36,35,nx+70+Math.max(0,60-(endT-290)),gy-50,50,49); }
  drawTruck(tx,ty,{lights:true,kellan:endT<200,bernie:endT<200,ang:-0.0001+ang,len,rot:tx*0.3,riders:[MOM,DAD],hop:endT>270});
  // Diana: in the cage, then down the ladder, then celebrating
  let dX=cageX+8, dY=cageY+8, inCage=true;
  if(endT>175){ inCage=false; const c=clamp((endT-175)/90,0,1); dX=tipX-8+(pvx+28-tipX+8)*c; dY=tipY-26+(ty+12-24-(tipY-26))*c; }
  const cele=endT>270, hop=cele?Math.abs(Math.sin(endT*0.15))*8:0;
  const drawD=()=>g.drawImage((cele||inCage&&((t>>4)&1))?DI.jump.r:DI.idle.r,Math.round(dX),Math.round(dY-hop));
  if(inCage) drawD();
  drawCage(cageX,cageY,null); if(endT>175){ rect('#5A4060',cageX+10,cageY+31,12,3); }
  if(!inCage) drawD();
  if(endT>=200){ g.drawImage(K.jump.r,Math.round(tx+84),Math.round(gy-24-Math.abs(Math.cos(endT*0.15))*8)); g.drawImage(PUPS.open.r,Math.round(tx+99),Math.round(gy-15-Math.abs(Math.sin(endT*0.2))*5)); }
  for(const p of parts){ g.fillStyle=p.c; g.fillRect(p.x|0,p.y|0,2,2); }
  post.push(()=>{
    if(endT<175) txt('HANG ON, DIANA!',VW/2,8,10,'#FFE14D','center');
    else if(endT<290) txt('DOWN THE LADDER!',VW/2,8,10,'#FFE14D','center');
    else { txt('HOORAY!',VW/2,6,16,'#FFE14D','center'); txt('THE WHOLE FAMILY IS SAFE!',VW/2,28,8,'#fff','center'); if(endT>330) txt('THE DINOS GOT THEIR EGGS BACK!',VW/2,42,6,'#FFE0F0','center'); if(endT>380) txt('THANK YOU KELLAN AND BERNIE!',VW/2,54,6,'#8EE08E','center'); }
    if(endT>420&&((t>>4)&1)) txt(coarse?'TAP TO PLAY AGAIN':'PRESS SPACE',VW/2,PH+6,7,'#fff','center');
  });
  blitFlush();
}
function draw(){
  hot.length=0; post.length=0; g.imageSmoothingEnabled=false;
  switch(state){
    case 'title': drawTitle(); break;
    case 'select': drawSelect(); break;
    case 'play': case 'drive': drawPlay(); overlayMsgs(); blitFlush(); break;
    case 'pause': drawPlay(); drawPauseOverlay(); blitFlush(); break;
    case 'levelEnd': drawLevelEnd(); break;
    case 'ending': drawEnding(); break;
  }
}

/* ---------------- sizing and loop ---------------- */
function resize(){
  const app=document.getElementById('app'), r=app.getBoundingClientRect();
  const aspect=r.width/Math.max(1,r.height);
  VW=clamp(Math.round(VH*aspect/2)*2,320,448);
  lo.width=VW; lo.height=VH; g=lo.getContext('2d'); g.imageSmoothingEnabled=false;
  let cw=r.width, ch=cw*VH/VW; if(ch>r.height){ ch=r.height; cw=ch*VW/VH; }
  cv.style.width=cw+'px'; cv.style.height=ch+'px';
  document.documentElement.style.setProperty('--hud',(innerHeight-(r.top+(r.height+ch)/2)+ch*(VH-PH)/VH)+'px');
  const dpr=Math.min(3,window.devicePixelRatio||1); cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr); SC=cv.height/VH;
  if(LV){ camX=clamp(camX,0,Math.max(0,LV.W*T-VW)); }
}
addEventListener('resize',resize); resize();
if(document.fonts&&document.fonts.load) document.fonts.load('8px "Press Start 2P"').catch(()=>{});
let acc=0, last=performance.now();
function frame(now){
  acc+=Math.min(100,now-last); last=now;
  // keep the loop alive even if something unexpected throws, so the game never freezes
  try{ if(window.__FTmanual) acc=0; else while(acc>=1000/60){ step(); acc-=1000/60; } }catch(err){ acc=0; hit.clear(); console.error(err); }
  try{ draw(); }catch(err){ console.error(err); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ if(state==='play'){ pausedFrom='play'; state='pause'; } setMusic(null); try{ speechSynthesis.cancel(); }catch(e){} } });
// test hook for automated play-testing (harmless in normal play)
window.__FT={get state(){return state;}, set state(v){state=v;}, P, get LV(){return LV;}, LEVELS, DIFF, startLevel, loadLevel, step, draw, down, hit, get camX(){return camX;}, get stars(){return saveData.stars;},
  setDiff:d=>{diff=d;}, get diff(){return diff;}, get hot(){return hot;}, get lvl(){return lvl;}, setTap:(x,y)=>{tapX=x;tapY=y;hit.add('tap');}, get VW(){return VW;}, finishLevel, get endT(){return endT;}, set endT(v){endT=v;}, get lastResult(){return lastResult;},
  icon:size=>{ const c=document.createElement('canvas'); c.width=c.height=128; const keep=g; g=c.getContext('2d'); g.imageSmoothingEnabled=false;
    g.fillStyle='#FFD08A'; g.fillRect(0,0,128,128); g.fillStyle='#E8502A'; g.fillRect(0,0,128,60); drawVolcano(98,70,70,40,'#8A3A2A',true);
    g.fillStyle='#58C23A'; g.fillRect(0,92,128,36); g.drawImage(RAPTOR[0].l,92,72); drawTruck(14,54,{lights:true,kellan:true,bernie:true}); g.drawImage(EGGS[1],4,80);
    const o=document.createElement('canvas'); o.width=o.height=size; const ox=o.getContext('2d'); ox.imageSmoothingEnabled=false; ox.drawImage(c,0,0,size,size); g=keep; return o.toDataURL('image/png'); }};
requestAnimationFrame(frame);
})();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
